[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "atavism"
version = "0.1.0"
description = "Contract Intelligence and Specification Adherence benchmark for LLM-based software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Atavism Research"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
atavism = "atavism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "benchmark"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
